version: "3.9"
services:
  api:
    build: ./services/api
    ports: ["4100:4100"]
    environment:
      PORT: 4100
      JWT_SECRET: markethub-dev-secret
      CORS_ORIGIN: http://localhost:5173
    depends_on: [db, redis]
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: markethub
      POSTGRES_PASSWORD: markethub
      POSTGRES_DB: markethub
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
